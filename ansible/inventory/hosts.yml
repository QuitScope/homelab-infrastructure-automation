---
all:
  children:
    lab:
      hosts:
        lab-iac-01:
          # DHCP address, found with scripts/vm-ip.sh (scripts/ansible.sh passes LAB_VM_IP through).
          ansible_host: "{{ lookup('ansible.builtin.env', 'LAB_VM_IP') }}"
      vars:
        # cloud-init installs the key for root; the base role adds the admin user.
        ansible_user: root
    siem:
      hosts:
        siem-docker:
          ansible_host: 192.168.178.91
          ansible_user: root
