---
- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present

- name: Forward auth logs to Cribl via UDP
  ansible.builtin.template:
    src: 90-cribl.conf.j2
    dest: /etc/rsyslog.d/90-cribl.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Start rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
